name: Validate ✅

# Gates pull requests into main. Deploys nothing, publishes nothing.
# Every pull request, whatever it targets. Restricting this to
# `branches: [main]` meant a stacked PR — one opened against another
# feature branch rather than main — silently got no validation at all,
# which is precisely when a diff is hardest to eyeball.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref }}
  # A superseded push has nothing worth finishing.
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # A release PR only touches package.json and CHANGELOG.md. Running the
    # full matrix on a mechanical version bump buys nothing.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # Bun-only: the root workspaces.catalog is not understood by npm or pnpm.
      - run: bun install --frozen-lockfile

      # Cheapest first, so a formatting slip fails in seconds.
      - name: Lint and format
        run: bun run check:ci

      - name: Build
        run: bun run build

      - name: Check types
        run: bun run check-types

      - name: Check types (scripts)
        run: bun run check-types:scripts

      - name: Test
        run: bun run test

      - name: Build the site
        run: bun run build --filter=@laqi/site

      - name: Site content lint
        run: bun scripts/site/content-lint.ts apps/site/src

      - name: Site link check
        # linkinator serves from $CWD when given a plain relative path, which
        # 404s every absolute link (/docs/, /favicon.svg, ...). Pinning
        # --server-root avoids that. A single English root: the site is
        # deliberately English-only (the es locale was removed with the
        # language selector). Absolute https://laqi.dev self-references
        # (canonical, og:image, llms.txt) are skipped — before the first
        # deploy the domain does not answer, and every one of them has a
        # relative twin that this crawl does validate. The panel link on the
        # quick start (127.0.0.1:8000) only answers on a reader's machine
        # with laqi running — but the skip must name the port: linkinator's
        # own static server also lives on 127.0.0.1, and a portless pattern
        # skips the crawl's starting URL itself, "passing" with 0 links.
        run: bunx --bun linkinator . --server-root apps/site/dist --recurse --silent --skip "^https://laqi\.dev" --skip "^http://127\.0\.0\.1:8000"
