# .github/workflows/deploy-site.yml
name: Deploy site

# Merge to main, not a tag: the site is content, and a typo fix must
# reach laqi.dev without cutting a version of the CLI. Path-filtered so
# an unrelated change elsewhere in the monorepo never triggers a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/tokens/**'
      - 'apps/cli/package.json'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build --filter=@laqi/site

      # Workers static assets, not Pages: apps/site/wrangler.jsonc holds the
      # whole deployment shape — including the laqi.dev custom domain, which
      # Pages could only bind from the dashboard.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: deploy
