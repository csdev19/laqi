# .github/workflows/deploy-site.yml
name: Deploy site

# The site releases exactly like the CLI does: release-please opens a
# site release PR, and merging THAT — never an ordinary merge to main —
# cuts a site-v* tag, which is what deploys. Site and package stay
# fully decoupled: shipping one never ships the other. The tag is cut
# with RELEASE_PLEASE_TOKEN (a PAT), so this push event does fire —
# tags created with the default GITHUB_TOKEN would be suppressed.
# workflow_dispatch is the manual escape hatch (first deploy, redeploy
# after an incident) — it deploys whatever main currently holds.
on:
  push:
    tags: ['site-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in the `production` environment, not at
    # repo level — a job only sees an environment's secrets when it
    # declares that environment (same reason release-please.yml does).
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build --filter=@laqi/site

      # Workers static assets, not Pages: apps/site/wrangler.jsonc holds the
      # whole deployment shape — including the laqi.dev custom domain, which
      # Pages could only bind from the dashboard.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: deploy
